[project]
name = "llm-gateway"
version = "0.1.0"
description = "Resilient LLM gateway: provider failover, caching, retrieval, verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Heavy ML stack. Imported lazily so the core installs and tests without them.
rag = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.40",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
cache = [
    "redis>=5.0",
]
# Semantic retrieval behind the same Retriever contract as BM25, so the two can be
# benchmarked against each other. langchain-core carries the vector store and the
# Embeddings interface; the embedding model itself is the caller's choice and is not
# pinned here, because it is the one decision that determines whether semantic
# retrieval beats lexical on this corpus.
langchain = [
    "langchain-core>=1.0",
    "numpy>=1.26",
]
# LightRAG knowledge-graph retrieval. Heavy: it extracts entities with an LLM at index
# time, so it needs a real model and a writable working directory to be useful.
lightrag = [
    "lightrag-hku>=1.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fastapi>=0.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
