name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  # The retrieval gate. It only runs once the golden set exists, because a gate over
  # unverified questions measures nothing and would still be treated as authoritative.
  # The set is mechanically verified, not hand-verified: gateway.rag.verify_set checks
  # each answer against the document its label cites. See docs/RESULTS.md for what that
  # does and does not establish.
  rag-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Check the reviewed golden set exists
        run: |
          if [ ! -f evals/goldens.jsonl ]; then
            echo "evals/goldens.jsonl is absent."
            echo "Run: uv run python -m gateway.rag.label   # propose questions"
            echo "     uv run python -m gateway.rag.verify_set  # verify mechanically"
            echo "     uv run python -m gateway.rag.promote     # promote OK rows"
            exit 1
          fi
      - name: Fetch the pinned corpus
        run: ./scripts/fetch_corpus.sh
      - name: Retrieval gate
        run: uv run python scripts/run_eval.py
      - name: Ablation
        run: uv run python scripts/ablation.py

  # The comparison gate lands with the hybrid retriever. Until there is a baseline to
  # regress against, a gate has nothing to compare.
  #
  #   - name: Regression gate
  #     run: uv run python scripts/gate.py --max-drop 0.02
